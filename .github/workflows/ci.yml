name: ci-lite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER_LC: marouanof

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Postgres éphémère pour le contextLoads du user-service (profil prod) :
    # même câblage qu'en prod, données jetables, 0 secret réel.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nestora
          POSTGRES_PASSWORD: ci-dummy-password
          POSTGRES_DB: userdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          path: nestora-ops

      - name: Checkout Nestora app
        uses: actions/checkout@v4
        with:
          repository: Marouanof/Nestora
          path: Nestora

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Test user-service
        working-directory: Nestora/user-service
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: userdb
          DB_USER: nestora
          DB_PASS: ci-dummy-password
          JWT_SECRET: ci-dummy-secret-min-32-chars-0123456789abcdef
          JWT_EXPIRATION: 86400000
          GATEWAY_SHARED_SECRET: ci-dummy-gateway-secret
          APP_GATEWAY_URL: http://localhost:8080
          MAIL_USERNAME: dummy@example.com
          MAIL_PASSWORD: dummy
          EMAIL_SIMULATION: "true"
          SERVER_PORT: 8081
        run: chmod +x mvnw && ./mvnw -B test

      - name: Test gateway
        working-directory: Nestora/gateway
        env:
          JWT_SECRET: ci-dummy-secret-min-32-chars-0123456789abcdef
          GATEWAY_SHARED_SECRET: ci-dummy-gateway-secret
        run: chmod +x mvnw && ./mvnw -B test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nestora/frontend/package-lock.json

      - name: Lint + build frontend
        working-directory: Nestora/frontend
        run: |
          npm ci
          # Lint informatif (non-bloquant, pratique standard) : le build (tsc) reste la porte.
          npm run lint --if-present || echo "::warning::ESLint signale des problèmes (non-bloquant)"
          npm run build

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: user-service
            context: Nestora/user-service
            dockerfile: nestora-ops/docker/Dockerfile.user-service
            image: nestora-user-service
          - service: gateway
            context: Nestora/gateway
            dockerfile: nestora-ops/docker/Dockerfile.gateway
            image: nestora-gateway
    steps:
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          path: nestora-ops

      - name: Checkout Nestora app
        uses: actions/checkout@v4
        with:
          repository: Marouanof/Nestora
          path: Nestora

      - name: Prepare frontend nginx file (frontend job only)
        if: matrix.service == 'frontend'
        run: cp nestora-ops/docker/nginx.conf Nestora/frontend/nginx.ops.conf

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (no push on PR)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:latest,ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ github.sha }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
        continue-on-error: true

  docker-frontend:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nestora-ops
      - uses: actions/checkout@v4
        with:
          repository: Marouanof/Nestora
          path: Nestora
      - run: cp nestora-ops/docker/nginx.conf Nestora/frontend/nginx.ops.conf
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: Nestora/frontend
          file: nestora-ops/docker/Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.OWNER_LC }}/nestora-frontend:latest,ghcr.io/${{ env.OWNER_LC }}/nestora-frontend:${{ github.sha }}
