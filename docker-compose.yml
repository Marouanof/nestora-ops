# Nestora Ops — stack lite (postgres + user-service + gateway + frontend + minio)
# Code source Nestora : C:/LF/dmareeb (= Marouanof/Nestora @ 902da54).
# Les contexts ci-dessous sont absolus (PC de dev). En CI, les images se
# construisent via docker/build-push-action (voir .github/workflows/ci.yml).
# Voir scripts/sync-dockerfiles.ps1 (copie nginx.conf vers le frontend).
name: nestora-lite

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nestora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-userdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nestora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: C:/LF/dmareeb/user-service
      dockerfile: C:/nestora-ops/docker/Dockerfile.user-service
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-marouanof}/nestora-user-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-userdb}
      DB_USER: ${POSTGRES_USER:-nestora}
      DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?set GATEWAY_SHARED_SECRET}
      APP_GATEWAY_URL: http://gateway:8080
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-dummy@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-dummy}
      EMAIL_SIMULATION: ${EMAIL_SIMULATION:-true}
      SERVER_PORT: 8081
      FILE_UPLOAD_DIR: /app/uploads
      # --- Stockage S3 (décommenter pour S3Mock local ; voir §8 du README) ---
      # STORAGE_TYPE: s3
      # AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      # AWS_S3_BUCKET_NAME: ${S3_BUCKET:-nestora-uploads}
      # AWS_S3_ENDPOINT: http://s3mock:9090
      # AWS_ACCESS_KEY: test
      # AWS_SECRET_KEY: test
    ports:
      - "8081:8081"

  gateway:
    build:
      context: C:/LF/dmareeb/gateway
      dockerfile: C:/nestora-ops/docker/Dockerfile.gateway
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-marouanof}/nestora-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - user-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?set GATEWAY_SHARED_SECRET}
      USER_SERVICE_URI: http://user-service:8081
      PROPERTY_SERVICE_URI: http://user-service:8081
      BOOKING_SERVICE_URI: http://user-service:8081
      PAYMENT_SERVICE_URI: http://user-service:8081
      NOTIFICATION_SERVICE_URI: http://user-service:8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: C:/LF/dmareeb/frontend
      dockerfile: C:/nestora-ops/docker/Dockerfile.frontend
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-marouanof}/nestora-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"

  # Faux S3 local (S3Mock d'Adobe) : même API qu'AWS, zéro carte, zéro compte.
  # Buckets créés au démarrage via INITIAL_BUCKETS. Port 9090 = HTTP.
  # Vérif : curl http://localhost:9090/nom-bucket/ (PUT crée, GET liste).
  s3mock:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-nestora-uploads}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3mock-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  s3mock-data:
