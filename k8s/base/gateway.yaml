apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: nestora
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/marouanof/nestora-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: nestora-secrets, key: JWT_SECRET}}}
            - {name: GATEWAY_SHARED_SECRET, valueFrom: {secretKeyRef: {name: nestora-secrets, key: GATEWAY_SHARED_SECRET}}}
            - {name: USER_SERVICE_URI, value: "http://user-service:8081"}
            - {name: PROPERTY_SERVICE_URI, value: "http://user-service:8081"}
            - {name: BOOKING_SERVICE_URI, value: "http://user-service:8081"}
            - {name: PAYMENT_SERVICE_URI, value: "http://user-service:8081"}
            - {name: NOTIFICATION_SERVICE_URI, value: "http://user-service:8081"}
            - {name: CORS_ALLOWED_ORIGINS, value: "http://localhost,http://localhost:3000,http://localhost:5173"}
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: 800m, memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: nestora
spec:
  selector: {app: gateway}
  ports:
    - {port: 8080, targetPort: 8080}
