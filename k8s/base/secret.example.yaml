# Copier vers secret.yaml (gitignoré) et remplir les vraies valeurs :
#   cp secret.example.yaml secret.yaml
# Référence les mêmes variables que application-prod.properties (user-service)
# et application.yml (gateway).
apiVersion: v1
kind: Secret
metadata:
  name: nestora-secrets
  namespace: nestora
type: Opaque
stringData:
  POSTGRES_USER: "nestora"
  POSTGRES_PASSWORD: "change-me"
  POSTGRES_DB: "userdb"
  JWT_SECRET: "change-me-min-32-chars-0123456789abcdef"
  JWT_EXPIRATION: "86400000"
  GATEWAY_SHARED_SECRET: "change-me-gateway-secret"
  MAIL_USERNAME: "dummy@example.com"
  MAIL_PASSWORD: "dummy"
