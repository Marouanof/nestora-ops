# Observabilité locale : se lance FUSIONNÉ avec le compose principal
# (même projet, même réseau -> les noms postgres/gateway/user-service résolvent) :
#   docker compose -f docker-compose.yml -f monitoring/docker-compose.monitoring.yml up -d
# Ne PAS lancer ce fichier seul (projet séparé = réseau séparé = DNS cassé).

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      # Chemin relatif au projet (1er -f), pas au sous-dossier monitoring/
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # 9091 côté hôte : 9090 est déjà pris par S3Mock
    ports: ["9091:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-nestora}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-userdb}?sslmode=disable"
    depends_on: [postgres]

  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    ports: ["9115:9115"]

volumes:
  grafana-data:
