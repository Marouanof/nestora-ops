global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Santé HTTP des APIs (sans instrumentation : probe /actuator/health).
  # Remplace gateway/user-service par les noms DNS Compose ou K8s.
  - job_name: blackbox-nestora
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gateway:8080/actuator/health
          - http://user-service:8081/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
